<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mosaico settings</title>
<style>
:root {
  --bg: #000; --card: #141414; --field: #222; --edge: #2c2c2c;
  --text: #f4f4f5; --text2: #a6a6ad; --text3: #75757c;
  --accent: #7ad6a0; --accent-dim: #163626; --red: #ff6b5e; --warn: #f0b858;
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--text); color-scheme: dark; }
body { margin: 0 auto; max-width: 720px; padding: 24px 16px 64px;
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
h1 { font-size: 28px; margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--text3); flex: 1; }
h2 { font-size: 19px; margin: 0; }
section { background: var(--card); border: 1px solid var(--edge); border-radius: 20px;
  padding: 18px 18px 16px; margin: 0 0 16px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.note { color: var(--text3); font-size: 13px; }
label { display: block; margin-top: 14px; color: var(--text2); font-size: 13px; font-weight: 600; }
label .state { font-weight: 400; color: var(--text3); }
input, textarea, select { width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--edge); background: var(--field); color: var(--text); font: inherit; }
textarea { min-height: 84px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > input, .row > textarea { flex: 1; }
.row > button { margin-top: 6px; }
.row.top { align-items: flex-start; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 16px;
  cursor: pointer; background: var(--field); color: var(--text); }
button.primary { background: var(--accent); color: #06200f; }
button.small { padding: 6px 10px; font-size: 13px; margin-top: 6px; }
.row > button.small { padding: 10px 12px; }
button:disabled { opacity: 0.4; cursor: default; }
.actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.msg { font-size: 14px; color: var(--text2); }
.msg.ok { color: var(--accent); }
.msg.err { color: var(--red); }
.share { border: 1px solid var(--edge); border-radius: 16px; padding: 4px 14px 14px; margin-top: 14px; }
.share .row { justify-content: space-between; margin-top: 10px; }
#login { max-width: 360px; margin: 12vh auto 0; text-align: center; }
#login input { text-align: center; font-size: 28px; letter-spacing: 0.3em; }
#login p { color: var(--text2); }
.hidden { display: none !important; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); opacity: 0;
  background: var(--accent); color: #06200f; font-weight: 600; padding: 10px 18px; border-radius: 999px;
  transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.sc { border: 1px solid var(--edge); border-radius: 16px; padding: 12px 14px; margin-top: 12px; }
.sc .top { display: flex; align-items: center; gap: 10px; }
.sc .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc .steps { color: var(--text2); font-size: 13px; margin-top: 4px; }
.sc .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sc .tools button { margin-top: 0; }
.chip { width: 12px; height: 12px; border-radius: 6px; flex: none; }
.sc.off { opacity: 0.7; }
.sc .when { color: var(--text); font-size: 13px; margin-top: 4px; }
.sc .steps { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace; }
.sc.editing h3 { font-size: 15px; margin: 18px 0 2px; color: var(--text2); }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--field); color: var(--text2); }
.badge.ok { background: var(--accent-dim); color: var(--accent); }
.block { border: 1px solid var(--edge); border-radius: 14px; padding: 8px 10px 10px; margin-top: 8px; background: #181818; }
.block.logic { border-color: #3d3456; background: #17151c; }
.block.trig { background: #151a17; }
.block .bh { display: flex; align-items: center; gap: 6px; }
.block .bh > .fields { flex: 1; }
.block .bh button { margin-top: 0; }
.block .num { color: var(--text3); font: 12px ui-monospace, Menlo, monospace; min-width: 2.6em; }
.block .kind { font-weight: 600; flex: 1; }
.branch { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text2); font-size: 13px; font-weight: 600; }
.branch button { margin-top: 0; }
.nest { margin-left: 6px; padding-left: 10px; border-left: 2px solid #3d3456; }
.cond { margin-top: 6px; }
.cond .nest > .cond { border: 1px dashed var(--edge); border-radius: 12px; padding: 4px 8px 8px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 0 8px; }
label.ctl { margin-top: 6px; font-size: 12px; }
label.ctl input, label.ctl select { margin-top: 3px; padding: 8px 10px; }
label.check { display: flex; align-items: center; gap: 6px; font-weight: 400; color: var(--text2); }
label.check input { width: auto; margin: 0; }
select.add { width: auto; margin-top: 8px; padding: 7px 10px; font-size: 13px; color: var(--accent); }
.days { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.days button { padding: 6px 9px; font-size: 12px; margin-top: 0; }
.days button.on { background: var(--accent); color: #06200f; }
.log { font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: var(--text2); background: #0b0b0b;
  border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
.log.bad { border-color: #5a2a26; }
details summary { cursor: pointer; color: var(--text2); font-size: 13px; margin-top: 8px; }
details summary.bad { color: var(--red); }
details.loc { margin-top: 14px; }
@media (max-width: 560px) { .nest { margin-left: 2px; padding-left: 6px; } .block { padding: 6px 7px 8px; } }
button.danger { color: var(--red); }
</style>
</head>
<body>
<div id="login" class="hidden">
  <h1>Mosaico</h1>
  <p>Enter the code shown on the board under Settings, Web settings.</p>
  <form id="login-form">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus>
    <div class="actions" style="justify-content:center"><button class="primary" type="submit">Sign in</button></div>
    <p id="login-msg" class="msg err"></p>
  </form>
</div>

<div id="main" class="hidden">
  <header>
    <h1>Mosaico</h1>
    <span class="sub">Settings</span>
    <button id="off" type="button">Turn off</button>
  </header>
  <div id="sections"></div>
  <p class="note">Saved keys never leave the board: a key field shows only whether it is set. Type to replace it.
  This page works while Web settings is on (it turns itself off after 10 minutes unused).</p>
</div>

<div id="toast" role="status"></div>
<div id="gone" class="hidden">
  <h1>Mosaico</h1>
  <p id="gone-msg" class="msg"></p>
</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const show = id => ["login", "main", "gone"].forEach(x => $("#" + x).classList.toggle("hidden", x !== id));
let status = {};

async function api(path, body) {
  const init = { credentials: "same-origin", cache: "no-store" };
  if (body !== undefined) {
    init.method = "POST";
    init.headers = { "X-Mosaico": "1", "Content-Type": typeof body === "string" ? "text/plain" : "application/json" };
    init.body = typeof body === "string" ? body : JSON.stringify(body);
  }
  let r;
  try { r = await fetch(path, init); } catch (e) { offline(); throw e; }
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { show("login"); throw new Error("sign in"); }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function offline(text) {
  $("#gone-msg").textContent = text ||
    "The board does not answer. Web settings may be off (Settings on the board) or the board restarting.";
  show("gone");
}

let toastTimer;
function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2500);
}

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  for (const k of kids) e.append(k);
  return e;
}

// A field. kind: text, url, secret (shows only whether it is set), pem (the same, multi-line).
function field(kind, title, value, hint = "") {
  const secret = kind === "secret" || kind === "pem";
  const input = kind === "pem" ? el("textarea", { spellcheck: false }) :
    el("input", { type: kind === "secret" ? "password" : kind === "url" ? "url" : "text",
                  autocomplete: kind === "secret" ? "new-password" : "off", spellcheck: false });
  const state = el("span", { className: "state" });
  const wrap = el("div", { className: kind === "pem" ? "row top" : "row" }, input);
  const box = el("label", {}, title + " ", state, wrap);
  const f = { box, input, cleared: false };
  if (secret) {
    const set = value === true;
    state.textContent = set ? "· set" : "· not set";
    input.placeholder = set ? "Saved. Type to replace" : (hint || "Not set");
    if (set) {
      const clear = el("button", { type: "button", className: "small", textContent: "Clear" });
      clear.onclick = () => {
        f.cleared = !f.cleared;
        input.value = "";
        input.disabled = f.cleared;
        input.placeholder = f.cleared ? "Cleared when you save" : "Saved. Type to replace";
        clear.textContent = f.cleared ? "Keep" : "Clear";
        input.dispatchEvent(new Event("input", { bubbles: true }));
      };
      wrap.append(clear);
    }
    f.changed = () => f.cleared || input.value !== "";
    f.value = () => f.cleared ? "" : input.value;
  } else {
    input.value = value || "";
    input.placeholder = hint;
    f.changed = () => input.value.trim() !== (value || "");
    f.value = () => input.value.trim();
  }
  return f;
}

function sectionBox(title, note) {
  const s = el("section");
  s.append(el("div", { className: "head" }, el("h2", { textContent: title }), el("span", { className: "note", textContent: note })));
  return s;
}

function actions(section, label, onSave) {
  const button = el("button", { className: "primary", type: "button", textContent: label, disabled: true });
  const msg = el("span", { className: "msg" });
  section.append(el("div", { className: "actions" }, button, msg));
  const say = (text, kind = "") => { msg.textContent = text; msg.className = "msg " + kind; };
  button.onclick = async () => {
    button.disabled = true;
    say("Saving…");
    try { await onSave(say); } catch (e) { say(e.message, "err"); button.disabled = false; }
  };
  return { button, say };
}

async function saveSection(name, change, say) {
  const { reply } = await api("/api/save", { [name]: change });
  if (reply === "ok restart") {
    offline("Saved. The board is restarting to apply it. Web settings are off after a restart: switch them on again in Settings to change more.");
    return false;
  }
  if (reply !== "ok") throw new Error(reply);
  toast("Saved");  // the section is drawn again from the board's answer
  return true;
}

// Swifty and Glimdock: plain key/value sections.
const SIMPLE = [
  { name: "swifty", title: "Swifty", note: "Applies at once", fields: [
    ["llm_url", "Model server URL", "url", "http://model-server:8080/v1"],
    ["llm_model", "Model", "text", "The server's default"],
    ["llm_key", "Model key", "secret"],
    ["search_key", "Web search key (Tavily)", "secret", "Not set: no web search"],
    ["asr_url", "Speech URL", "url", "wss://speech-server/v1/asr/realtime"],
    ["asr_model", "Speech model", "text"],
    ["asr_key", "Speech key", "secret"],
    ["asr_ca", "Speech server certificate (PEM)", "pem", "Only for a privately signed speech server"],
  ] },
  { name: "glimdock", title: "Glimdock", note: "Saving restarts the board", fields: [
    ["endpoint", "Collector URL", "url", "https://collector/api/v1/snapshot"],
    ["token", "Display token", "secret"],
    ["ssid", "Wi-Fi network", "text", "Empty: Vibe Mode's network"],
    ["password", "Wi-Fi password", "secret"],
    ["setup_token", "Setup token", "secret"],
    ["ca", "Collector certificate (PEM)", "pem", "Needed for an https:// collector"],
  ] },
];

function renderSimple(spec) {
  const values = status[spec.name] || {};
  const s = sectionBox(spec.title, spec.note);
  const grid = el("div", { className: "grid" });
  s.append(grid);
  const fields = spec.fields.map(([key, title, kind, hint]) => {
    const f = field(kind, title, values[key], hint);
    (kind === "pem" ? s : grid).append(f.box);
    return [key, f];
  });
  const { button } = actions(s, "Save", async say => {
    const change = {};
    for (const [key, f] of fields) if (f.changed()) change[key] = f.value();
    if (await saveSection(spec.name, change, say)) await reload();
  });
  s.addEventListener("input", () => { button.disabled = !fields.some(([, f]) => f.changed()); });
  return s;
}

function renderHome() {
  const h = status.home || {};
  const s = sectionBox("Home", h.paired ? "Paired with " + (h.name || h.hub) : "Not paired");
  s.append(el("p", { className: "note", textContent: "Make a code in Swifty Home: Displays, Pair a display." }));
  const grid = el("div", { className: "grid" });
  const hub = field("url", "Swifty Home hub", h.hub, "http://hub:8080");
  const code = field("text", "Pairing code", "", "From Swifty Home");
  grid.append(hub.box, code.box);
  s.append(grid);
  const { button } = actions(s, "Pair", async say => {
    const { reply } = await api("/api/save", { home: { hub: hub.value(), pairing_code: code.value() } });
    if (reply !== "ok") throw new Error(reply);
    say("Pairing…");
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 1500));
      const note = ((await api("/api/status")).home || {}).pairing || "";
      if (note && note !== "pairing") {
        if (note.startsWith("paired")) { toast("Paired"); await reload(); }
        else { say(note.replace(/^failed: /, ""), "err"); button.disabled = false; }
        return;
      }
    }
    say("No answer from the hub", "err");
    button.disabled = false;
  });
  s.addEventListener("input", () => { button.disabled = !(hub.value() && code.value()); });
  return s;
}

function renderFiles() {
  const fs = status.files || { shares: [], photos: {} };
  const s = sectionBox("Files", "Network shares for Files, the camera's photos and Swifty's notes");
  const list = el("div");
  s.append(list);
  const shares = [];
  const changed = () => button.disabled = false;
  function addShare(v = {}) {
    const box = el("div", { className: "share" });
    const grid = el("div", { className: "grid" });
    const f = {
      name: field("text", "Name", v.name, "Shown in Files"),
      host: field("text", "Host", v.host, "An address or a name the board resolves"),
      share: field("text", "Share", v.share),
      path: field("text", "Start folder", v.path, "Optional"),
      user: field("text", "User", v.user),
      password: field("secret", "Password", v.password === undefined ? false : v.password),
    };
    Object.values(f).forEach(x => grid.append(x.box));
    const remove = el("button", { type: "button", className: "small", textContent: "Remove this share" });
    const entry = { f, box, isNew: !v.host };
    remove.onclick = () => { shares.splice(shares.indexOf(entry), 1); box.remove(); changed(); refreshPhotos(); };
    box.append(grid, el("div", { className: "row" }, el("span"), remove));
    list.append(box);
    shares.push(entry);
  }
  (fs.shares || []).forEach(v => addShare(v));
  const add = el("button", { type: "button", className: "small", textContent: "Add a share" });
  add.onclick = () => { addShare(); changed(); };
  s.append(add);
  // Where the camera's photos go, and Swifty's own folder (the one place it writes).
  const photosShare = el("select"), swiftyShare = el("select");
  const photosPath = field("text", "Photos folder", (fs.photos || {}).path, "Mosaico Photos");
  const swiftyPath = field("text", "Swifty's folder", (fs.swifty || {}).path, "Swifty");
  const pick = el("label", {}, "Camera photos go to", photosShare);
  const pickSwifty = el("label", {}, "Swifty's notes and lists go to", swiftyShare);
  function refreshPhotos() {
    const names = shares.map(x => x.f.name.value()).filter(Boolean);
    for (const [select, saved, first] of [[photosShare, fs.photos, "The first share"], [swiftyShare, fs.swifty, "The photos share"]]) {
      const keep = select.value || (saved || {}).share || "";
      select.replaceChildren(el("option", { value: "", textContent: first }),
        ...names.map(n => el("option", { value: n, textContent: n })));
      select.value = [...select.options].some(o => o.value === keep) ? keep : "";
    }
  }
  refreshPhotos();
  s.append(el("div", { className: "grid" }, pick, photosPath.box, pickSwifty, swiftyPath.box));
  const { button } = actions(s, "Save", async say => {
    const out = shares.map(({ f }) => {
      const o = {};
      for (const k of ["name", "host", "share", "user", "path"]) o[k] = f[k].value();
      if (f.password.changed()) o.password = f.password.value();
      return o;
    });
    const change = { shares: out, photos: { share: photosShare.value, path: photosPath.value() },
      swifty: { share: swiftyShare.value, path: swiftyPath.value() } };
    if (await saveSection("files", change, say)) await reload();
  });
  s.addEventListener("input", () => { changed(); refreshPhotos(); });
  s.addEventListener("change", changed);
  return s;
}

// The always-on display: a dim clock after this long without use.
const ALWAYS_ON = [[0, "Off"], [30, "After 30 seconds"], [60, "After 1 minute"], [120, "After 2 minutes"],
  [300, "After 5 minutes"], [600, "After 10 minutes"]];

function renderDisplay() {
  const d = status.display || {};
  const saved = d.always_on ?? 0;
  const s = sectionBox("Display", "Applies at once");
  const select = el("select");
  for (const [v, text] of ALWAYS_ON) select.append(el("option", { value: String(v), textContent: text }));
  select.value = String(saved);
  s.append(el("label", {}, "Always-on display", select));
  s.append(el("p", { className: "note",
    textContent: "A dim clock on black once the board is unused this long. A touch, the AI key or a reminder brings back the app." }));
  const { button } = actions(s, "Save", async say => {
    if (await saveSection("display", { always_on: Number(select.value) }, say)) await reload();
  });
  select.onchange = () => { button.disabled = Number(select.value) === saved; };
  return s;
}

// ---- Shortcuts: small programs, like Shortcuts on a phone (shortcuts.h) ----
// The editor works on the board's own JSON (format 2): blocks for steps, ifs
// and repeats inside one another, conditions, triggers. The board checks
// every save and names the step that is wrong ("step 2.1: ..."); the numbers
// on the blocks are those.
let shortcuts = null;  // the board's answer to /api/shortcuts
const ACCENT_COLOURS = { violet: "#8c73ff", cyan: "#6fe3f7", amber: "#f7ce7e", green: "#8ee6b5" };
const STEP_KINDS = [["home", "Swifty Home"], ["wait", "Wait"], ["message", "Show a message"], ["if", "If … then"],
  ["repeat", "Repeat"], ["set", "Set a variable"], ["add", "Add to a variable"], ["run", "Run another shortcut"],
  ["stop", "Stop"], ["ir", "TV remote (infrared)"], ["board_lights", "Interaction board lights"],
  ["brightness", "Screen brightness"], ["open", "Open an app"], ["flashlight", "Flashlight"]];
const BLOCK_KINDS = ["if", "repeat"];
const VERBS = { lights_on: "Lights on", lights_off: "Lights off", lights_toggle: "Lights on or off", brightness: "Brightness",
  color: "Colour", scene: "Scene", plug_on: "Plug on", plug_off: "Plug off", plug_toggle: "Plug on or off", tv_on: "TV on",
  tv_off: "TV off", tv_toggle: "TV on or off", volume: "Speaker volume", play: "Play", pause: "Pause", mute: "Mute", unmute: "Unmute" };
const LIGHT_VERBS = ["lights_on", "lights_off", "lights_toggle", "brightness", "color"];
const PLUG_VERBS = ["plug_on", "plug_off", "plug_toggle"];
const NO_TARGET_VERBS = ["tv_on", "tv_off", "tv_toggle", "volume", "play", "pause", "mute", "unmute"];
// Home's commands: the ones named above and any others the board lists (Home learns new ones).
function verbPairs() {
  const all = [...Object.keys(VERBS), ...(shortcuts.verbs || []).filter(v => !VERBS[v])];
  return all.map(v => [v, VERBS[v] || v.replace(/_/g, " ")]);
}
const CHECKS = [["time", "Time is between"], ["day", "Day is"], ["home", "Home device"], ["motion", "Motion (Interaction)"],
  ["button", "Button held (Interaction)"], ["light", "Light level (Interaction)"], ["wifi", "On Wi-Fi"], ["vpn", "VPN is up"],
  ["battery", "Battery"], ["charging", "Charging"], ["var", "Variable"], ["and", "All of these"], ["or", "Any of these"],
  ["not", "Not"]];
const TRIGGERS = [["tile", "Tap its tile on the home screen"], ["time", "At a time"], ["every", "Every few minutes"],
  ["boot", "At start-up"], ["motion", "Motion (Interaction)"], ["button", "A button (Interaction)"],
  ["home", "A Home device changes"], ["sun", "Sunrise or sunset"]];
const DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DAY_LABELS = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat", sun: "Sun" };

function options(select, pairs, value) {
  select.replaceChildren(...pairs.map(([v, t]) => el("option", { value: v, textContent: t })));
  if (value !== undefined && value !== null && value !== "") {
    if (![...select.options].some(o => o.value === String(value)))
      select.append(el("option", { value: String(value), textContent: value + " (saved)" }));
    select.value = String(value);
  }
  return select;
}

// A small labelled control in a block: kind is select, number, text or time.
function ctl(title, input) {
  return el("label", { className: "ctl" }, title, input);
}
function num(value, min, max, step, onInput) {
  const i = el("input", { type: "number", value: value ?? "", min, max, step: step || 1 });

    case "motion": return c.within ? "motion in the last " + c.within + " s" : "there is motion";
    case "button": return (c.button === "any" || !c.button ? "a" : "the " + c.button) + " button is held";

function stepWords(s) {

// A list of blocks (the steps of a shortcut, an if's branch, a repeat).
function blockList(steps, depth, prefix, redraw, ctx) {
  const list = el("div", { className: depth ? "nest" : "" });
  steps.forEach((s, i) => list.append(block(s, steps, i, depth, prefix + (i + 1), redraw, ctx)));
  const add = el("select", { className: "add" });
  add.append(el("option", { value: "", textContent: steps.length ? "+ Add a step" : "+ Add the first step" }));
  for (const [k, t] of STEP_KINDS)
    if (depth < ctx.maxDepth || !BLOCK_KINDS.includes(k)) add.append(el("option", { value: k, textContent: t }));
  add.onchange = () => {
    if (!add.value) return;
    if (countSteps(ctx.sc.steps) >= ctx.maxSteps) { toast(ctx.maxSteps + " steps at most"); add.value = ""; return; }
    steps.push(newStep(add.value));
    redraw();
  };
  list.append(add);
  return list;
}

function block(s, steps, i, depth, path, redraw, ctx) {
  const logic = BLOCK_KINDS.includes(s.do);
  const b = el("div", { className: "block" + (logic ? " logic" : "") });
  const kindName = (STEP_KINDS.find(([k]) => k === s.do) || [s.do, s.do])[1];
  const up = el("button", { type: "button", className: "small", textContent: "↑", title: "Earlier" });
  const down = el("button", { type: "button", className: "small", textContent: "↓", title: "Later" });
  const del = el("button", { type: "button", className: "small danger", textContent: "×", title: "Remove this step" });
  up.disabled = i === 0;
  down.disabled = i === steps.length - 1;
  up.onclick = () => { steps.splice(i - 1, 0, steps.splice(i, 1)[0]); redraw(); };
  down.onclick = () => { steps.splice(i + 1, 0, steps.splice(i, 1)[0]); redraw(); };
  del.onclick = () => { steps.splice(i, 1); redraw(); };
  b.append(el("div", { className: "bh" }, el("span", { className: "num", textContent: path }),
    el("span", { className: "kind", textContent: kindName }), up, down, del));
  if (s.do === "if") {
    b.append(condEditor(s.if, x => s.if = x, redraw));
    b.append(el("div", { className: "branch", textContent: "Then" }), blockList(s.then, depth + 1, path + ".", redraw, ctx));
    (s.elif || []).forEach((e, k) => {
      const rm = el("button", { type: "button", className: "small danger", textContent: "Remove" });
      rm.onclick = () => { s.elif.splice(k, 1); if (!s.elif.length) delete s.elif; redraw(); };
      b.append(el("div", { className: "branch" }, "Else if ", rm), condEditor(e.if, x => e.if = x, redraw),
        blockList(e.then, depth + 1, path + ".", redraw, ctx));
    });
    if (s.else) {
      const rm = el("button", { type: "button", className: "small danger", textContent: "Remove" });
      rm.onclick = () => { delete s.else; redraw(); };
      b.append(el("div", { className: "branch" }, "Otherwise ", rm), blockList(s.else, depth + 1, path + ".", redraw, ctx));
    }
    const addElif = el("button", { type: "button", className: "small", textContent: "+ Else if" });
    addElif.onclick = () => { (s.elif = s.elif || []).push({ if: { check: "wifi" }, then: [] }); redraw(); };
    addElif.disabled = (s.elif || []).length >= 4;
    const addElse = el("button", { type: "button", className: "small", textContent: "+ Otherwise" });
    addElse.onclick = () => { s.else = []; redraw(); };
    addElse.disabled = !!s.else;
    b.append(el("div", { className: "row" }, addElif, addElse));
  } else if (s.do === "repeat") {
    const f = el("div", { className: "fields" });
    const mode = s.while ? "while" : "times";
    f.append(ctl("Repeat", pick([["times", "A number of times"], ["while", "While …"]], mode, v => {
      if (v === "while") { delete s.times; s.while = { check: "motion" }; s.max = 10; }
      else { delete s.while; delete s.max; s.times = 3; }
      redraw();
    })));
    if (mode === "times") f.append(ctl("Times (1–100)", num(s.times, 1, 100, 1, v => s.times = v)));
    else f.append(ctl("Rounds at most (1–100)", num(s.max || 10, 1, 100, 1, v => s.max = v)));
    b.append(f);
    if (mode === "while") b.append(condEditor(s.while, x => s.while = x, redraw));
    b.append(blockList(s.steps, depth + 1, path + ".", redraw, ctx));
  } else if (s.do !== "stop") {
    b.append(stepFields(s, redraw));
  }
  return b;
}

  const f = el("div", { className: "fields" });
  f.append(ctl("When", pick(TRIGGERS, t.on, v => { list[i] = newTrigger(v); redraw(); })));
  switch (t.on) {
    case "time": f.append(ctl("At", hhmm(t.at, v => t.at = v))); break;
    case "every":
      f.append(ctl("Minutes", num(t.minutes, 1, 1440, 1, v => t.minutes = v)));
      f.append(ctl("From", hhmm(t.from || "00:00", v => t.from = v)), ctl("To", hhmm(t.to || "23:59", v => t.to = v)));
      break;
    case "boot": f.append(ctl("After (s)", num(t.delay ?? 20, 0, 3600, 1, v => t.delay = v ?? 0))); break;
    case "motion": f.append(ctl("Again after (s)", num(t.cooldown ?? 60, 10, 86400, 1, v => t.cooldown = v ?? 60))); break;
    case "button": f.append(ctl("Button", pick([["any", "Either"], ["left", "Left"], ["right", "Right"]], t.button || "any", v => t.button = v))); break;
    case "home": {
      f.append(ctl("Device", txt(t.device, "Desk lamp", v => t.device = v, "sc-devices")));
      const mode = t.above !== undefined ? "above" : t.below !== undefined ? "below" : t.to || "any";
      f.append(ctl("Turns", pick([["on", "on"], ["off", "off"], ["any", "on or off"], ["above", "above (°)"], ["below", "below (°)"]], mode, v => {
        delete t.to; delete t.above; delete t.below;
        if (v === "above" || v === "below") t[v] = 24; else t.to = v;
        redraw();
      })));
      if (mode === "above" || mode === "below") f.append(ctl("Degrees", num(t[mode], -50, 100, 0.5, v => t[mode] = v ?? 0)));
      break;
    }
    case "sun":
      f.append(ctl("At", pick([["sunrise", "Sunrise"], ["sunset", "Sunset"]], t.event, v => t.event = v)));
      f.append(ctl("Minutes after (− before)", num(t.offset || 0, -180, 180, 1, v => t.offset = v || 0)));
      break;
  }
  b.append(el("div", { className: "bh" }, f, del));
  if (["time", "every", "sun"].includes(t.on)) b.append(dayChips(t));
  if (t.on === "sun" && !shortcuts.location) b.append(el("p", { className: "msg err", textContent: "Set the location below for sunrise and sunset." }));
  return b;
}

// Checks the board would refuse, said before a round trip.
function problems(sc, ctx) {
  const out = [];
  if (!sc.name.trim()) out.push("It needs a name.");
  if (!sc.steps.length) out.push("It needs a step.");
  if (countSteps(sc.steps) > ctx.maxSteps) out.push(ctx.maxSteps + " steps at most, in all.");
  const walk = (steps, path) => steps.forEach((s, i) => {
    const p = path + (i + 1);
    if (s.do === "repeat" && !(s.steps || []).length) out.push("Step " + p + ": a repeat needs a step inside.");
    if (s.do === "message" && !(s.text || "").trim()) out.push("Step " + p + ": the message needs text.");
    if (s.do === "run" && !s.shortcut && !s.id) out.push("Step " + p + ": choose a shortcut to run.");
    walk(s.then || [], p + "."); walk(s.else || [], p + "."); walk(s.steps || [], p + ".");
    (s.elif || []).forEach(e => walk(e.then || [], p + "."));
  });
  walk(sc.steps, "");
  return out;
}

function logBox(result) {
  const lines = [(result.ok === false ? "Failed: " : "") + (result.message || ""), ...(result.log || [])];
  return el("div", { className: "log" + (result.ok === false ? " bad" : ""), textContent: lines.join("\n") });
}

// The editor for one shortcut (sc null: a new one).
function shortcutEditor(sc, done) {
  const work = sc ? JSON.parse(JSON.stringify(sc)) : { name: "", accent: "violet", enabled: true, triggers: [{ on: "tile" }],
    steps: [{ do: "home", verb: "lights_off", target: "all" }] };
  delete work.last; delete work.next;
  work.triggers = work.triggers || [];
  const ctx = { sc: work, maxSteps: shortcuts.max_steps || 48, maxDepth: shortcuts.max_depth || 4 };
  const box = el("div", { className: "sc editing" });
  const name = field("text", "Name", work.name, "On the tile, e.g. Bedroom lights off");
  name.input.oninput = () => work.name = name.input.value;
  const icon = options(el("select"), (shortcuts.icons || []).map(x => [x, x]), work.icon || "");
  if (!work.icon) { icon.prepend(el("option", { value: "", textContent: "Chosen for the first step" })); icon.value = ""; }
  icon.onchange = () => { if (icon.value) work.icon = icon.value; else delete work.icon; };
  const accent = pick((shortcuts.accents || []).map(x => [x, x]), work.accent || "violet", v => work.accent = v);
  const enabled = el("input", { type: "checkbox", checked: work.enabled !== false });
  enabled.onchange = () => work.enabled = enabled.checked;
  box.append(el("div", { className: "grid" }, name.box, el("div", { className: "grid" },
    el("label", {}, "Icon", icon), el("label", {}, "Colour", accent))));
  box.append(el("label", { className: "check" }, enabled, " On: its triggers start it (off, only a tap does)"));
  const trigHead = el("h3", { textContent: "When" });
  const trigList = el("div");
  const stepHead = el("h3", { textContent: "Do" });
  const stepList = el("div");
  const warn = el("div", { className: "msg err" });
  const redraw = () => {
    trigList.replaceChildren(...work.triggers.map((t, i) => triggerRow(t, work.triggers, i, redraw)));
    if (!work.triggers.length) trigList.append(el("p", { className: "note", textContent: "Nothing starts it: run it here, from Swifty or from another shortcut." }));
    const addT = el("select", { className: "add" });
    addT.append(el("option", { value: "", textContent: "+ Add a trigger" }), ...TRIGGERS.map(([k, t]) => el("option", { value: k, textContent: t })));
    addT.onchange = () => {
      if (!addT.value) return;
      if (work.triggers.length >= 6) { toast("Six triggers at most"); addT.value = ""; return; }
      work.triggers.push(newTrigger(addT.value)); redraw();
    };
    trigList.append(addT);
    stepList.replaceChildren(blockList(work.steps, 0, "", redraw, ctx));
    stepHead.textContent = "Do · " + countSteps(work.steps) + " of " + ctx.maxSteps + " steps";
    warn.textContent = "";
  };
  redraw();
  box.append(trigHead, trigList, stepHead, stepList);
  const save = el("button", { type: "button", className: "primary", textContent: sc ? "Save" : "Make it" });
  const test = el("button", { type: "button", textContent: "Test (dry run)" });
  const cancel = el("button", { type: "button", textContent: "Cancel" });
  const msg = el("span", { className: "msg" });
  const result = el("div");
  box.append(warn, el("div", { className: "actions" }, save, test, cancel, msg), result);
  cancel.onclick = () => done(false);
  const ready = () => {
    const p = problems(work, ctx);
    warn.textContent = p.join(" ");
    return !p.length;
  };
  save.onclick = async () => {
    if (!ready()) return;
    save.disabled = true;
    msg.textContent = "Saving…"; msg.className = "msg";
    try {
      await api("/api/shortcuts", { op: "save", shortcut: work });
      toast(sc ? "Saved" : "Made");
      done(true);
    } catch (e) { msg.textContent = e.message; msg.className = "msg err"; save.disabled = false; }
  };
  test.onclick = async () => {
    if (!ready()) return;
    test.disabled = true;
    msg.textContent = "Testing on the board…"; msg.className = "msg";
    try {
      const r = await api("/api/shortcuts", { op: "test", shortcut: work });
      msg.textContent = r.ok === false ? "The test failed" : "Tested: nothing was sent";
      msg.className = "msg " + (r.ok === false ? "err" : "ok");
      result.replaceChildren(logBox(r));
    } catch (e) { msg.textContent = e.message; msg.className = "msg err"; }
    test.disabled = false;
  };
  return box;
}

function locationBox(redrawSection) {
  const loc = shortcuts.location || {};
  const lat = field("text", "Latitude", loc.lat !== undefined ? String(loc.lat) : "", "e.g. 51.51");
  const lon = field("text", "Longitude", loc.lon !== undefined ? String(loc.lon) : "", "e.g. -0.13 (west is negative)");
  const save = el("button", { type: "button", className: "small", textContent: "Save location" });
  const clear = el("button", { type: "button", className: "small", textContent: "Clear" });
  clear.disabled = !shortcuts.location;
  save.onclick = async () => {
    const a = Number(lat.value()), b = Number(lon.value());
    if (!lat.value() || !lon.value() || isNaN(a) || isNaN(b)) return toast("Decimal degrees, e.g. 51.51 and -0.13");
    try { await api("/api/shortcuts", { op: "location", lat: a, lon: b }); toast("Location saved"); redrawSection(true); } catch (e) { toast(e.message); }
  };
  clear.onclick = async () => {
    try { await api("/api/shortcuts", { op: "location", lat: null }); toast("Location cleared"); redrawSection(true); } catch (e) { toast(e.message); }
  };
  const d = el("details", { className: "loc" });
  d.append(el("summary", { textContent: "Location for sunrise and sunset" + (shortcuts.location ? " · set" : " · not set") }),
    el("p", { className: "note", textContent: "Kept on the board only. Two decimals (about a kilometre) are plenty." }),
    el("div", { className: "grid" }, lat.box, lon.box), el("div", { className: "row" }, save, clear));
  return d;
}

function renderShortcuts() {
  const s = sectionBox("Shortcuts", "Tiles, schedules and automations");
  if (!shortcuts) {
    s.append(el("p", { className: "note", textContent: "The board did not send its shortcuts." }));
    return s;
  }
  const h = shortcuts.home || {};
  if (!h.paired) s.append(el("p", { className: "note", textContent: "Pair Swifty Home (above) for home steps." }));
  else if (!h.ready) s.append(el("p", { className: "note", textContent: "Swifty Home has not answered yet: rooms and lights come when it does." }));
  if (shortcuts.dry_run) s.append(el("p", { className: "msg err", textContent: "Every run is a dry run (set over ESP-Iris) until the board restarts." }));
  const devices = el("datalist", { id: "sc-devices" });
  const seen = new Set();
  for (const d of shortcuts.devices || [])
    for (const n of [d.name, d.room]) if (n && !seen.has(n)) { seen.add(n); devices.append(el("option", { value: n })); }
  const targets = el("datalist", { id: "sc-targets" });
  for (const list of Object.values(h))
    if (Array.isArray(list)) for (const d of list) if (d && d.name && d.target) targets.append(el("option", { value: d.name }));
  s.append(devices, targets);
  const holder = el("div");
  s.append(holder);
  const all = shortcuts.shortcuts || [];
  const redrawSection = async changed => {
    if (changed) shortcuts = await api("/api/shortcuts");
    s.replaceWith(renderShortcuts());
  };
  all.forEach(sc => {
    const card = el("div", { className: "sc" + (sc.enabled === false ? " off" : "") });
    const chip = el("span", { className: "chip" });
    chip.style.background = ACCENT_COLOURS[sc.accent] || "#888";
    const auto = (sc.triggers || []).some(t => t.on !== "tile");
    const badges = el("span", { className: "row" });
    if (sc.enabled === false && auto) badges.append(el("span", { className: "badge", textContent: "Off" }));
    if ((sc.last || {}).running) badges.append(el("span", { className: "badge ok", textContent: "Running" }));
    card.append(el("div", { className: "top" }, chip, el("span", { className: "name", textContent: sc.name }), badges,
      el("span", { className: "note", textContent: sc.icon })));
    const when = (sc.triggers || []).map(triggerWords).join(" · ") || "Run by hand";
    card.append(el("div", { className: "when", textContent: when + (sc.next ? " · next " + sc.next : "") }));
    card.append(el("div", { className: "steps", textContent: stepLines(sc.steps).join("\n") }));
    const last = sc.last || {};
    if (last.message) {
      const d = el("details", { className: "lastrun" });
      d.append(el("summary", { className: last.ok ? "" : "bad", textContent: "Last run" + (last.at ? " " + last.at : "") + " (" + last.source + ")" +
        (last.dry ? ", a test" : "") + ": " + (last.ok ? "" : "failed: ") + last.message }), logBox(last));
      card.append(d);
    }
    const run = el("button", { type: "button", className: "small", textContent: "Run" });
    const test = el("button", { type: "button", className: "small", textContent: "Test (dry run)" });
    const edit = el("button", { type: "button", className: "small", textContent: "Edit" });
    const onoff = el("button", { type: "button", className: "small", textContent: sc.enabled === false ? "Turn on" : "Turn off" });
    const del = el("button", { type: "button", className: "small danger", textContent: "Delete" });
    const out = el("div");
    card.append(el("div", { className: "tools" }, run, test, edit, ...(auto ? [onoff] : []), del), out);
    const call = async (body, okText) => {
      try { await api("/api/shortcuts", body); toast(okText); return true; } catch (e) { toast(e.message); return false; }
    };
    run.onclick = () => call({ op: "run", id: sc.id }, "Running on the board");
    test.onclick = async () => {
      test.disabled = true;
      try { out.replaceChildren(logBox(await api("/api/shortcuts", { op: "test", id: sc.id }))); } catch (e) { toast(e.message); }
      test.disabled = false;
    };
    edit.onclick = () => card.replaceWith(shortcutEditor(sc, changed => redrawSection(changed)));
    onoff.onclick = async () => { if (await call({ op: "enable", id: sc.id, on: sc.enabled === false }, sc.enabled === false ? "On" : "Off")) redrawSection(true); };
    del.onclick = async () => {
      if (!confirm("Delete “" + sc.name + "”" + ((sc.triggers || []).some(t => t.on === "tile") ? " and its tile?" : "?"))) return;
      if (await call({ op: "delete", id: sc.id }, "Deleted")) redrawSection(true);
    };
    holder.append(card);
  });
  if (!all.length) holder.append(el("p", { className: "note", textContent: "No shortcuts yet." }));
  else holder.append(el("p", { className: "note", textContent: "A tile moves and hides on the home screen like an app. Automations nobody tapped stay quiet unless they fail or show a message." }));
  const add = el("button", { type: "button", className: "primary", textContent: "New shortcut", disabled: all.length >= (shortcuts.max || 24) });
  const starters = el("button", { type: "button", textContent: "Add starters", disabled: !h.ready });
  const reload = el("button", { type: "button", textContent: "Refresh" });
  starters.title = "All lights off, and lights off for your rooms";
  add.onclick = () => { holder.prepend(shortcutEditor(null, changed => redrawSection(changed))); add.disabled = true; };
  starters.onclick = async () => {
    try {
      const { added } = await api("/api/shortcuts", { op: "starters" });
      toast(added ? added + " added" : "They are there already");
      redrawSection(true);
    } catch (e) { toast(e.message); }
  };
  reload.onclick = () => redrawSection(true);
  s.append(el("div", { className: "actions" }, add, starters, reload));
  s.append(locationBox(redrawSection));
  return s;
}

// The VPN (WireGuard): a whole .conf pasted, or its fields. Keys show only whether they are set.
const VPN_STATES = { "off": "Off", "not set up": "Not set up", "waiting for Wi-Fi": "Waiting for Wi-Fi",
  "connecting": "Connecting", "connected": "Connected", "trouble": "Trouble connecting" };

function renderVpn() {
  const v = status.vpn;
  if (!v) return el("span");
  const state = VPN_STATES[v.state] || v.state || "";
  const s = sectionBox("VPN", "WireGuard · " + state + (v.state === "connected" && v.tunnel_address ? " as " + v.tunnel_address : ""));
  s.append(el("p", { className: "note", textContent:
    "While on, all of the board's internet traffic goes through the tunnel (AllowedIPs 0.0.0.0/0), DNS too when the configuration names servers. The local network stays direct." }));
  if (v.error) s.append(el("p", { className: "msg err", textContent: v.error }));
  if (v.board_public_key) {
    const key = el("input", { type: "text", readOnly: true, value: v.board_public_key, spellcheck: false });
    s.append(el("label", {}, "This board's public key (the server's [Peer] PublicKey for it)", el("div", { className: "row" }, key)));
  }
  // A whole configuration file.
  const conf = el("textarea", { spellcheck: false, placeholder: "[Interface]\nPrivateKey = ...\nAddress = 10.8.0.2/32\nDNS = 10.8.0.1\n\n[Peer]\nPublicKey = ...\nEndpoint = vpn.example.com:51820\nAllowedIPs = 0.0.0.0/0\nPersistentKeepalive = 25" });
  s.append(el("label", {}, "Paste a WireGuard configuration (.conf)", el("div", { className: "row top" }, conf)));
  const file = el("input", { type: "file", accept: ".conf,text/plain" });
  file.onchange = async () => { if (file.files[0]) { conf.value = await file.files[0].text(); conf.dispatchEvent(new Event("input", { bubbles: true })); } };
  s.append(el("label", {}, "or pick the file", file));
  const loadConf = actions(s, "Load configuration", async say => {
    const text = conf.value;
    conf.value = "";
    if (await saveSection("vpn", { conf: text }, say)) await reload();
  });
  conf.addEventListener("input", () => { loadConf.button.disabled = !conf.value.trim(); });
  // Or field by field.
  const grid = el("div", { className: "grid" });
  const f = {
    private_key: field("secret", "Private key", v.private_key, "[Interface] PrivateKey"),
    address: field("text", "Address", v.address, "10.8.0.2/32"),
    dns: field("text", "DNS", v.dns, "Empty: the network's"),
    public_key: field("text", "Server public key", v.public_key, "[Peer] PublicKey"),
    preshared_key: field("secret", "Preshared key", v.preshared_key, "Optional"),
    endpoint: field("text", "Endpoint", v.endpoint, "vpn.example.com:51820"),
    allowed_ips: field("text", "Allowed IPs", v.allowed_ips, "Empty: 0.0.0.0/0 (everything)"),
    persistent_keepalive: field("text", "Persistent keepalive (s)", v.persistent_keepalive ? String(v.persistent_keepalive) : "", "0: off; 25 behind NAT"),
  };
  Object.values(f).forEach(x => grid.append(x.box));
  s.append(grid);
  const fields = actions(s, "Save", async say => {
    const change = {};
    for (const [key, x] of Object.entries(f)) if (x.changed()) change[key] = x.value();
    if ("persistent_keepalive" in change) {
      const n = Number(change.persistent_keepalive || 0);
      if (!Number.isInteger(n) || n < 0 || n > 65535) throw new Error("Keepalive: seconds from 0 to 65535");
      change.persistent_keepalive = n;
    }
    if (await saveSection("vpn", change, say)) await reload();
  });
  grid.addEventListener("input", () => { fields.button.disabled = !Object.values(f).some(x => x.changed()); });
  // Switch and start-up.
  const auto = el("select");
  auto.append(el("option", { value: "1", textContent: "Yes" }), el("option", { value: "0", textContent: "No" }));
  auto.value = v.auto_connect ? "1" : "0";
  auto.onchange = async () => {
    try { if (await saveSection("vpn", { auto_connect: auto.value === "1" })) await reload(); }
    catch (e) { toast(e.message); }
  };
  s.append(el("div", { className: "grid" }, el("label", {}, "Connect at start-up", auto)));
  const toggle = el("button", { type: "button", className: v.on ? "" : "primary", textContent: v.on ? "Disconnect" : "Connect",
    disabled: !v.configured });
  const say = el("span", { className: "msg" });
  toggle.onclick = async () => {
    toggle.disabled = true;
    try { if (await saveSection("vpn", { on: !v.on })) setTimeout(() => reload().catch(() => {}), 2500); }
    catch (e) { say.textContent = e.message; say.className = "msg err"; toggle.disabled = false; }
  };
  s.append(el("div", { className: "actions" }, toggle, say));
  return s;
}

function render() {
  $("#sections").replaceChildren(...SIMPLE.map(renderSimple), renderHome(), renderShortcuts(), renderFiles(), renderVpn(), renderDisplay());
}

async function reload() {
  status = await api("/api/status");
  shortcuts = await api("/api/shortcuts").catch(e => { if (e.message === "sign in") throw e; return null; });
  render();
  show("main");
}

$("#login-form").onsubmit = async e => {
  e.preventDefault();
  $("#login-msg").textContent = "";
  try {
    await api("/api/login", $("#code").value.trim());
    $("#code").value = "";
    await reload();
  } catch (err) {
    if (err.message !== "sign in") $("#login-msg").textContent = err.message;
  }
};

$("#off").onclick = async () => {
  try { await api("/api/stop", {}); } catch (e) { /* off either way */ }
  offline("Web settings are off. Switch them on again in Settings on the board.");
};

reload().catch(e => { if (e.message !== "sign in") offline(); });
</script>
